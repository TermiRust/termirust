[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/<owner>/termirust"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
