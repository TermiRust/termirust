[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/<owner>/termirust"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate", "macros"] }
chacha20poly1305 = "0.11"
keyring = "4.2"
zeroize = { version = "1.9", features = ["derive"] }
uuid = { version = "1.28", features = ["v7", "serde"] }
getrandom = "0.4"
portable-pty = "0.9"
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
