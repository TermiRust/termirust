# cargo-deny: known vulnerabilities, licenses compatible with AGPL-3.0, trusted sources.
# Run locally with `cargo deny check`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Marvin: RSA private-key timing side channel, no fixed `rsa` release exists. An SSH
  # client signs once per login on the user's own machine, which gives an attacker no
  # practical way to time many operations. Ed25519 keys are unaffected. Revisit when
  # russh moves to a patched rsa.
  { id = "RUSTSEC-2023-0071", reason = "client-side signing only; no patched release" },
  # Unmaintained compile-time macros pulled in by specta/tauri and glib (Linux); they do
  # not run in the shipped app.
  { id = "RUSTSEC-2024-0436", reason = "paste: build-time macro via specta/tauri" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro via glib" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive and weak-copyleft licenses that can be combined with AGPL-3.0.
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
