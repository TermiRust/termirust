# SSH servers for termirust-core integration tests:
#   docker compose -f docker/test-ssh.yml up -d
#   cargo test -p termirust-core --features integration
name: termirust-test-ssh

services:
  ssh-password:
    image: linuxserver/openssh-server:10.3_p1-r1-ls239
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      PASSWORD_ACCESS: "true"
      USER_NAME: termirust
      USER_PASSWORD: termirust-test
      # Public halves of crates/core/tests/fixtures/keys.
      PUBLIC_KEY: |-
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFBV+krWrQZZjPmKoiHb2r0vvmReK5C8TASqnRiOmK7w termirust-test
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEUQmwJbheLbLPM2hdVGFwm3Kv11WwrEHNqJHRvN2PDX termirust-test-encrypted
        ssh-rsa  termirust-test-rsa
        ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBDTWd0+1zkDXQUr1q3GQy6DSe1ON7wYro/A32ZYZ5krSUBwZkdC2iUOTSrsBG0uKViN3S613Hx0zATaqpVpY/yA= termirust-test-ecdsa
    ports:
      - "127.0.0.1:2222:2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222"]
      interval: 2s
      retries: 30
